<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Happy Mother's Day!</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #fceabb, #f8b500);
            color: #5a3e1b;
            text-align: center;
            padding: 50px;
            overflow-x: hidden;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 0.2em;
        }
        #message {
            font-size: 1.5em;
            margin: 20px auto;
            max-width: 600px;
            min-height: 60px;
            color: #3e2f1c;
            transition: opacity 2s ease;
        }
        #showMessageBtn {
            background-color: #f8b500;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.3s ease, opacity 2s ease;
        }
        #showMessageBtn:hover {
            background-color: #d18e00;
        }
        img {
            margin-top: 30px;
            max-width: 300px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: opacity 2s ease;
        }
        footer {
            margin-top: 50px;
            font-size: 0.9em;
            color: #6b4f1d;
        }

        /* Heart button container adjusted to prevent overlap */
        #heartContainer {
            display: none;
            margin-top: 450px;
            position: relative;
            width: 100%;
            height: 200px;
            user-select: none;
        }

        /* Heart-shaped button */
        #heartBtn {
            background-color: #ff4d4d;
            border: none;
            width: 50px;
            height: 50px;
            cursor: pointer;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translate(-50%, 0) rotate(-45deg);
            transition: left 0.5s ease, opacity 2s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            z-index: 10;
        }
        #heartBtn::before,
        #heartBtn::after {
            content: "";
            background-color: #ff4d4d;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            position: absolute;
        }
        #heartBtn::before { top: -25px; left: 0; }
        #heartBtn::after { top: 0; left: 25px; }

        /* Text positioned safely below or away from the heart paths */
        #heartText {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            font-size: 1.4em;
            font-weight: bold;
            color: #5a3e1b;
            transition: opacity 0.5s ease;
        }

        /* Highlighted final message */
        #finalMessage {
            display: none;
            font-size: 4em;
            color: #d10000;
            font-weight: 900;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            margin-top: 100px;
            opacity: 0;
            transition: opacity 2s ease;
        }
    </style>
</head>
<body>
    <div id="mainContent">
        <h1>Happy Mother's Day!</h1>
        <div id="message">Click the button below for a special message.</div>
        <button id="showMessageBtn" onclick="showMessage()">Show me a message</button>
        <br />
        <img id="flowerImg" src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=400&q=80" alt="Beautiful flowers" />
        <footer>With love, from your son 💖</footer>
    </div>

    <div id="heartContainer">
        <button id="heartBtn" aria-label="Heart button"></button>
        <div id="heartText">Click the heart to acknowledge you are the best mom ever!</div>
    </div>

    <div id="finalMessage">HAPPY MOTHER'S DAY!</div>

    <script>
        const messages = [
            "You are the heart of our family.",
            "Thank you for your endless love and support.",
            "I am so grateful to have you as my mom.",
            "Wishing you a day filled with joy and laughter!",
            "Love you to the moon and back!"
        ];

        let index = 0;
        const mainContent = document.getElementById('mainContent');
        const messageDiv = document.getElementById('message');
        const showMessageBtn = document.getElementById('showMessageBtn');
        const heartContainer = document.getElementById('heartContainer');
        const heartBtn = document.getElementById('heartBtn');
        const heartText = document.getElementById('heartText');
        const finalMessage = document.getElementById('finalMessage');

        function showMessage() {
            if (index < messages.length) {
                messageDiv.textContent = messages[index];
                index++;
            }
            
            if (index === messages.length) {
                showMessageBtn.disabled = true;
                setTimeout(() => {
                    mainContent.style.transition = "opacity 2s";
                    mainContent.style.opacity = '0';
                    setTimeout(() => {
                        mainContent.style.display = 'none';
                        heartContainer.style.display = 'block';
                    }, 2000);
                }, 1000);
            }
        }

        let hoverCount = 0;
        
        heartBtn.addEventListener('mouseenter', () => {
            if (hoverCount === 0) {
                heartBtn.style.left = '20%';
                heartText.textContent = "Wait! You can't run away from the truth!";
                hoverCount++;
            } else if (hoverCount === 1) {
                heartBtn.style.left = '80%';
                heartText.textContent = "Almost got it... but you're still the best!";
                hoverCount++;
            }
        });

        heartBtn.addEventListener('click', () => {
            // Dissolve effect
            heartBtn.style.opacity = '0';
            heartText.style.opacity = '0';
            
            setTimeout(() => {
                heartContainer.style.display = 'none';
                finalMessage.style.display = 'block';
                setTimeout(() => {
                    finalMessage.style.opacity = '1';
                }, 100);

                // Auto-close sequence
                setTimeout(() => {
                    window.close();
                    // Fallback if window.close() is blocked by browser security
                    document.body.innerHTML = "<h1>Happy Mother's Day! ❤️</h1><p>You may now close this tab.</p>";
                }, 3000);
            }, 2000);
        });
    </script>
</body>
</html>
